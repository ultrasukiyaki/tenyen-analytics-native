name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP lint
        run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find . -type f -name '*.js' -not -path './node_modules/*' -not -path './dist/*' -print0 | xargs -0 -n1 node --check
      - name: Composer metadata
        run: composer validate --no-check-publish
      - name: Smoke tests
        run: php tests/run.php
      - name: Build release
        if: matrix.php == '8.4'
        run: tools/build-release.sh
